<!doctype html>
<html lang="%t:app.lang%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1528" />
    <link rel="icon" href="data:," />
    <title>%t:app.title%</title>
  </head>
  <body>
    <main id="app">
      <div id="game"></div>
      <!-- On-screen controls: hidden unless the device has touch (see src/systems/touchControls.ts). -->
      <div id="touch-controls" aria-hidden="true">
        <div id="stick-col">
          <div id="stick"><div id="stick-knob"></div></div>
          <!-- Speed buttons (session 6f, owner's decision 5): x1, x2, x4, x8; shown when the speedButtons flag is on. -->
          <div id="speed-row" hidden>
            <div class="speed-btn" data-level="0">%t:speed.0%</div>
            <div class="speed-btn" data-level="1">%t:speed.1%</div>
            <div class="speed-btn" data-level="2">%t:speed.2%</div>
            <div class="speed-btn" data-level="3">%t:speed.3%</div>
          </div>
        </div>
        <div id="action-btn"></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
